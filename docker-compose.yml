version: '3.8'

services:
  game-monitor-backend:
    image: roo831/game-activity-monitoring-service:latest
    pull_policy: always
    container_name: game-monitor-backend
    restart: always
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - SE_MONITOR_SERVER_IP=5.9.118.202
      - SE_MONITOR_QUERY_PORT=27021
      - SE_MONITOR_LOG_FILE_PATH=/app/logs/activity_log.txt
      - WATCHLIST_STATE_FILE=/app/logs/watchlist.json
      - APPLICATION_LOG_FILE=/app/logs/game-monitoring.log
    volumes:
      - ./server_logs:/app/logs
